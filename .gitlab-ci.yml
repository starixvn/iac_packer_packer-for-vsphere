##############################################################################
##
## Auto-generated .gitlab-ci.yml for building Packer Example for vSphere
##
## Do not modify this file directly, either:
##
##     - modify the source build.yaml
##     - modify the template build-ci.tmpl
##
## then run the following command to re-create the .gitlab-ci.yml file:
##
##     gomplate -c build.yaml -f build-ci.tmpl -o .gitlab-ci.yml
## 
## OR run gomplate with docker:
##
##     docker run --rm -v $(pwd):/workspace -w /workspace hairyhenderson/gomplate:stable -c build.yaml -f build-ci.tmpl -o .gitlab-ci.yml
##
##############################################################################

stages:
  - build
  - deploy

##############################################################################

variables:
  SCRIPT_PATH: "${CI_PROJECT_DIR}"
  CONFIG_PATH: "${CI_PROJECT_DIR}/config"
  INPUT_PATH: ""
  BUILD_VARS: ""
  EXTRA_VAR_FILES: ""
  BUILD_ONLY: ""

  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_FORCE_HTTPS: "true"

  REGISTRY_USER: "$DOCKER_REG_LOCAL_USERNAME"
  REGISTRY_PASS: "$DOCKER_REG_LOCAL_PASSWORD"
  REGISTRY_URL: "$DOCKER_REG_LOCAL_URL"

  BASE_IMAGE: quay.io/kubespray/kubespray:v2.23.0
  IMAGE_NAME: base/packer
  IMAGE_TAG: v1.10.2-u2204
  IMAGE: "${REGISTRY_URL}/${IMAGE_NAME}:${IMAGE_TAG}"

##############################################################################

.general-script:
  set-build-env:
    - if [[ $CI_COMMIT_BRANCH == env/local-testlab ]]; then 
        cat $PACKERVAR_VSPHERE_LOCAL_B64 | base64 -d > vsphere.pkrvars.hcl;
      else cat $PACKERVAR_VSPHERE_LOCAL_B64 | base64 -d > vsphere.pkrvars.hcl;
      fi
  docker-login:
    - "docker login -u $REGISTRY_USER -p $REGISTRY_PASS $REGISTRY_URL"

##############################################################################

build_runner:
  stage: build
  tags:
    - docker
  before_script:
    - !reference [.general-script, docker-login]
  script:
    - "docker build --no-cache --build-arg BASE_IMAGE=\"$BASE_IMAGE\" -f Dockerfile -t $IMAGE ."
    - "docker push $IMAGE"
    - "docker logout $REGISTRY_URL"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes: 
        - Dockerfile

##############################################################################

.packer-build:
  stage: deploy
  image: $IMAGE
  tags: 
    - docker
  environment:
    PACKER_PLUGIN_PATH: "/workspace/.packer.d/plugins"
  before_script:
    - !reference [.general-script, set-build-env]
    - "cat $PACKERVAR_BUILDUSER_CRED_B64 | base64 -d > build.pkrvars.hcl"
    - "cat $PACKERVAR_ANSIBLE_CRED_B64 | base64 -d > ansible.pkrvars.hcl"
    - "packer init \"$INPTUenv_PATH\""
    - "packer validate -var-file=\"vsphere.pkrvars.hcl\" -var-file=\"build.pkrvars.hcl\" -var-file=\"ansible.pkrvars.hcl\" -var-file=\"$CONFIG_PATH/proxy.pkrvars.hcl\" -var-file=\"$CONFIG_PATH/common.pkrvars.hcl\" -var-file=\"$CONFIG_PATH/$BUILD_VARS\" ${EXTRA_VAR_FILES} \"$INPUT_PATH\""

  script:
    - "packer build -force -on-error=ask -var-file=\"vsphere.pkrvars.hcl\" -var-file=\"build.pkrvars.hcl\" -var-file=\"ansible.pkrvars.hcl\" -var-file=\"$CONFIG_PATH/proxy.pkrvars.hcl\" -var-file=\"$CONFIG_PATH/common.pkrvars.hcl\" -var-file=\"$CONFIG_PATH/$BUILD_VARS\" ${EXTRA_VAR_FILES} ${BUILD_ONLY} \"$INPUT_PATH\""
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: never
    - when: manual

##############################################################################

Ubuntu-Server-22.04-LTS:
  extends: [.packer-build]
  variables:
    INPUT_PATH: "$SCRIPT_PATH/builds/linux/ubuntu/22-04-lts/"
    BUILD_VARS: "linux-ubuntu-22-04-lts.pkrvars.hcl"
    EXTRA_VAR_FILES: "-var-file=$CONFIG_PATH/network.pkrvars.hcl -var-file=$CONFIG_PATH/linux-storage.pkrvars.hcl"

##############################################################################

Ubuntu-Server-22.04-K8SNode-(build-from-VM-template):
  extends: [.packer-build]
  variables:
    INPUT_PATH: "$SCRIPT_PATH/builds/linux/ubuntu/22-04-k8snode/"
    BUILD_VARS: "linux-ubuntu-22-04-k8snode.pkrvars.hcl"
    EXTRA_VAR_FILES: "-var-file=$CONFIG_PATH/network.pkrvars.hcl -var-file=$CONFIG_PATH/linux-storage.pkrvars.hcl"

##############################################################################

Ubuntu-Server-22.04-SwarmNode-(build-from-VM-template):
  extends: [.packer-build]
  variables:
    INPUT_PATH: "$SCRIPT_PATH/builds/linux/ubuntu/22-04-docker/"
    BUILD_VARS: "linux-ubuntu-22-04-docker.pkrvars.hcl"
    EXTRA_VAR_FILES: "-var-file=$CONFIG_PATH/network.pkrvars.hcl -var-file=$CONFIG_PATH/linux-storage.pkrvars.hcl"
