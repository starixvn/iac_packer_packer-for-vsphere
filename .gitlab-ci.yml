##############################################################################
##
## Auto-generated .gitlab-ci.yml for building Packer Example for vSphere
##
## Do not modify this file directly, either:
##
##     - modify the source build.yaml
##     - modify the template build-ci.tmpl
##
## then run the following command to re-create the .gitlab-ci.yml file:
##
##     gomplate -c build.yaml -f build-ci.tmpl -o .gitlab-ci.yml
##
##############################################################################

stages:
  - auth
  - build
  - test
  - deploy

##############################################################################

variables:
  SCRIPT_PATH: "${CI_PROJECT_DIR}"
  CONFIG_PATH: "${CI_PROJECT_DIR}/config"
  INPUT_PATH: ""
  BUILD_VARS: ""
  EXTRA_VAR_FILES: ""
  BUILD_ONLY: ""

  BASE_IMAGE: alpine:3.18
  IMAGE_NAME: nexops/runner/packer-ansible
  IMAGE_TAG: alpine3.18
  DOCKER_REG_URL: hub.lumigame.com
  IMAGE: ${DOCKER_REG_URL}/${IMAGE_NAME}:${IMAGE_TAG}

  REGISTRY_USER: "$DOCKER_REG_LOCAL_USERNAME"
  REGISTRY_PASS: "$DOCKER_REG_LOCAL_PASSWORD"
  REGISTRY_URL: "$DOCKER_REG_LOCAL_URL"

##############################################################################

.general-script:
  docker-login:
    - "docker login -u $REGISTRY_USER -p $REGISTRY_PASS $REGISTRY_URL"

.registry_auth:
  script:
    - !reference [.general-script, docker-login]

##############################################################################

build_runner:
  stage: build
  tags:
    - docker
  before_script:
    - !reference [.general-script, docker-login]
  script:
    - "docker build --no-cache --build-arg BASE_IMAGE=\"$BASE_IMAGE\" -f Dockerfile -t $IMAGE ."
    - "docker push $IMAGE"
    - "docker logout $REGISTRY_URL"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      changes: 
        - Dockerfile



##############################################################################

.packer-test:
  stage: test
  image: $IMAGE
  tags:
    - docker
  variables:
    PACKER_PLUGIN_PATH: ".packer.d/plugins"
  script:
    - "packer init \"$INPUT_PATH\""
    - "packer validate -var-file=\"$PACKERVAR_VSPHERE_LOCAL\" -var-file=\"$PACKERVAR_BUILDUSER_CRED\" -var-file=\"$PACKERVAR_ANSIBLE_CRED\" -var-file=\"$CONFIG_PATH/proxy.pkrvars.hcl\" -var-file=\"$CONFIG_PATH/common.pkrvars.hcl\" -var-file=\"$CONFIG_PATH/$BUILD_VARS\" ${EXTRA_VAR_FILES} \"$INPUT_PATH\""
  artifacts:
    paths:
      - ".packer.d/plugins"


##############################################################################

.packer-build:
  stage: deploy
  image: $IMAGE
  tags:
    - docker
  variables:
    PACKER_PLUGIN_PATH: ".packer.d/plugins"
  script:
    - "packer build -force -on-error=ask -var-file=\"$PACKERVAR_VSPHERE_LOCAL\" -var-file=\"$PACKERVAR_BUILDUSER_CRED\" -var-file=\"$PACKERVAR_ANSIBLE_CRED\" -var-file=\"$CONFIG_PATH/proxy.pkrvars.hcl\" -var-file=\"$CONFIG_PATH/common.pkrvars.hcl\" -var-file=\"$CONFIG_PATH/$BUILD_VARS\" ${EXTRA_VAR_FILES} ${BUILD_ONLY} \"$INPUT_PATH\""
  when: manual

